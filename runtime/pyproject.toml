[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lake-agent-runtime"
version = "0.7.0"
description = "Bounded asynchronous harness for heterogeneous data-pool agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "jsonschema>=4.23,<5",
    "httpx>=0.28,<1",
    "langgraph>=1.2.19,<1.3",
    "langchain-core>=1.7.3,<1.8",
    "langsmith>=0.14.17,<0.15",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[project.scripts]
lake-agent-demo = "lake_agent.demo:main"
lake-agent-web = "lake_agent.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lake_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
